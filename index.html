<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8bb5b7">
  <title>Zuma Music — Coming Soon</title>
  <meta name="description" content="Zuma lands in 2027. Join the waitlist.">
  <meta property="og:title" content="Zuma Music — Coming Soon">
  <meta property="og:description" content="Zuma lands in 2027.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zuma.music">
  <meta property="og:image" content="https://zuma.music/og-zuma.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ZUMA MUSIC wordmark centered on the Zuma background">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://zuma.music/og-zuma.png">
  <link rel="icon" href="dolphin-favicon.png">
  <link rel="apple-touch-icon" href="dolphin-favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261124-shop-grip-align">
  <link rel="preload" as="image" href="notice-wave.png">
  <link rel="preload" as="image" href="contact-rainwave-black.png">
  <link rel="preload" as="image" href="tasklist-glass.svg">
  <link rel="preload" as="image" href="assets/archives-ivory-grain.webp" fetchpriority="low">
  <link rel="stylesheet" href="archives-skin.css?v=20261021-w95fa-titles">
</head>
<body>
  <main class="desktop">
    <div class="wash" aria-hidden="true"></div>
    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="Zuma Music home"><img src="zuma-music-wordmark.png" alt="Zuma Music"></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="https://tstack.app/zuma" target="_blank" rel="noopener noreferrer">demos</a>
        <button class="contact-trigger" id="contact-trigger" type="button" aria-haspopup="dialog">contact</button>
      </nav>
    </header>

    <div class="contact-layer" id="contact-layer" hidden>
      <section class="contact-window contact-art-window" role="dialog" aria-modal="false" aria-labelledby="contact-title">
        <div class="contact-titlebar">
          <span class="contact-title-scrub" aria-hidden="true"></span>
          <h2 id="contact-title">Contact</h2>
          <img class="contact-art-icon" src="contact-rainwave-black.png" alt="">
          <button class="contact-art-control contact-minimize" id="contact-minimize" type="button" aria-label="Minimize contact window"><img src="contact-task.png" alt=""></button>
          <button class="contact-art-control contact-maximize" id="contact-maximize" type="button" aria-label="Maximize contact window"><img src="contact-max.png" alt=""></button>
          <button class="contact-art-control contact-close" id="contact-close" type="button" aria-label="Close contact window"><img src="contact-x.png" alt=""></button>
        </div>
        <form class="contact-form contact-art-form" id="contact-form" action="https://formsubmit.co/ajax/demos@zuma.music" method="POST">
            <input type="hidden" name="_subject" value="New message from zuma.music">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">
            <label for="contact-name">Name:</label>
            <input id="contact-name" name="name" type="text" required autocomplete="name">
            <label for="contact-message">Message:</label>
            <textarea id="contact-message" name="message" required></textarea>
            <label for="contact-email">Email:</label>
            <input id="contact-email" name="email" type="email" required autocomplete="email">
            <div class="contact-honeypot" aria-hidden="true">
              <label for="contact-company">Company:</label>
              <input id="contact-company" name="_honey" type="text" tabindex="-1" autocomplete="off">
            </div>
            <p class="contact-status" id="contact-status" role="status" aria-live="polite"></p>
            <button class="contact-send" type="submit" aria-label="Send message"><img src="contact-send.png" alt=""></button>
        </form>
        <div class="contact-thankyou" id="contact-thankyou" role="status" aria-live="polite" hidden>
          <span>Thank you.</span>
          <small>Your message has been sent.</small>
        </div>
        <button class="window-resize-handle contact-resize-grip" type="button" aria-label="Resize contact window"></button>
      </section>
    </div>

    <div class="archives-layer" id="archives-layer" hidden>
      <section class="archives-window" id="archives-window" role="dialog" aria-modal="false" aria-labelledby="archives-title">
        <div class="archives-titlebar">
          <img class="archives-title-icon" src="dock-archives.png" alt="">
          <h2 id="archives-title">Archives</h2>
          <div class="archives-window-controls">
            <button id="archives-minimize" type="button" aria-label="Minimize archives window"><img src="assets/archives-task.png" alt=""></button>
            <button id="archives-maximize" type="button" aria-label="Maximize archives window"><img src="assets/archives-max.png" alt=""></button>
            <button id="archives-close" type="button" aria-label="Close archives window"><img src="assets/archives-close.png" alt=""></button>
          </div>
        </div>
        <div class="archives-menubar" aria-label="Archives menu">
          <details><summary>View</summary><div class="archives-menu" aria-label="Archives view">
            <button type="button" data-archive-view="dropdown" aria-pressed="true">Dropdown View</button>
            <button type="button" data-archive-view="folder" aria-pressed="false">Folder View</button>
          </div></details>
        </div>
        <div class="archives-toolbar">
          <span class="archives-toolbar-label">Address</span>
          <span class="archives-address" id="archives-address">LA_Archives</span>
        </div>
        <div class="archives-explorer">
          <nav class="archives-tree" aria-label="Archive folders">
            <div class="archives-tree-root">
              <button id="archives-root-toggle" class="archives-tree-toggle" type="button" aria-label="Collapse Zuma Archives" aria-expanded="true">−</button>
              <button id="archives-root-select" class="archives-tree-folder" type="button" data-folder="root"><span class="archives-folder-icon" aria-hidden="true"></span>Zuma_Archives</button>
            </div>
            <div id="archives-tree-children" class="archives-tree-children"></div>
          </nav>
          <div class="archives-content">
            <div class="archives-content-heading"><span id="archives-current-folder">Zuma_Archives</span><span id="archives-item-count">1 folder</span></div>
            <div class="archives-grid" id="archives-grid"></div>
          </div>
        </div>
        <div class="archives-statusbar"><button class="window-resize-handle archives-status-grip" type="button" aria-label="Resize archives window"></button></div>
        <div class="archives-viewer" id="archives-viewer" hidden>
          <div class="archives-viewer-top"><button id="archives-viewer-back" type="button">← Back to files</button><span id="archives-viewer-index"></span></div>
          <div class="archives-viewer-stage">
            <button class="archives-viewer-arrow" id="archives-prev" type="button" aria-label="Previous file">‹</button>
            <div class="archives-viewer-media" id="archives-viewer-media"></div>
            <button class="archives-viewer-arrow" id="archives-next" type="button" aria-label="Next file">›</button>
          </div>
          <div class="archives-viewer-caption" id="archives-viewer-caption"></div>
          <div class="archives-filmstrip" id="archives-filmstrip" aria-label="Archive files"></div>
        </div>
      </section>
    </div>

    <section class="notice-wrap" id="home" role="dialog" aria-modal="false" aria-label="ZUMA window" hidden>
      <div class="notice-window" id="notice-window">
        <div class="notice-art-stage">
          <img class="notice-art" src="zuma-coming-soon.svg?v=20261022-lossless" alt="" draggable="false">
          <span class="notice-title-text" aria-hidden="true">ZUMA</span>
          <div class="titlebar" id="titlebar" role="button" tabindex="0" aria-label="Drag ZUMA window. Use arrow keys to move it and Escape to reset.">
            <div class="mini-controls">
              <button class="window-minimize notice-minimize" id="notice-minimize" type="button" aria-label="Minimize ZUMA window"></button>
              <button class="window-minimize notice-maximize" id="notice-maximize" type="button" aria-label="Maximize ZUMA window"></button>
              <button class="window-minimize notice-close" id="notice-close" type="button" aria-label="Close ZUMA window"></button>
            </div>
          </div>
          <form id="waitlist-form" class="notice-form-overlay">
            <label class="sr-only" for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="email address" required autocomplete="email">
            <button type="submit" aria-label="Join the waitlist"></button>
          </form>
          <div class="success notice-form-message" id="form-message" role="status" hidden>waitlist signups open soon.</div>
        </div>
        <button class="window-resize-handle resize-grip" type="button" aria-label="Resize ZUMA window"></button>
      </div>
    </section>

    <section class="desktop-folders" aria-label="Zuma collections">
      <a class="desktop-icon music-icon" href="https://untitled.stream/library/project/MYrlEZppGPqCRY5uA4fcw" target="_blank" rel="noreferrer"><img class="folder" src="folder-icon.png" alt="">Music</a>
      <a class="desktop-icon cd-icon" href="https://linktr.ee/cdwavs" target="_blank" rel="noopener noreferrer" aria-label="CD"><img src="cd-face.png" alt="">CD</a>
      <a class="desktop-icon youtube-icon" href="https://www.youtube.com/@zumamusc" target="_blank" rel="noreferrer"><img class="folder" src="folder-icon.png" alt="">YouTube</a>
    </section>

    <div class="player-launch-status" id="player-launch-status" role="status" hidden><span>Opening player…</span><button type="button" hidden>Retry</button></div>
    <div class="shop-layer" id="shop-layer" hidden>
      <section class="shop-window" id="shop-window" role="dialog" aria-modal="false" aria-labelledby="shop-title">
        <h2 class="sr-only" id="shop-title">Zuma Shop</h2>
        <img class="shop-art" src="zuma-shop-compact.png" width="1669" height="1843" alt="Zuma Shop, coming in 2027" draggable="false">
        <div class="shop-chrome">
          <div class="shop-titlebar" aria-label="Drag Zuma Shop window">
            <span class="shop-title-text" aria-hidden="true">Shop</span>
          </div>
          <div class="shop-window-controls">
            <button class="shop-control shop-minimize" id="shop-minimize" type="button" aria-label="Minimize Shop window"></button>
            <button class="shop-control shop-maximize" id="shop-maximize" type="button" aria-label="Maximize Shop window"></button>
            <button class="shop-control shop-close" id="shop-close" type="button" aria-label="Close Shop window"></button>
          </div>
        </div>
        <div class="shop-body">
          <span class="shop-preview-hit shop-preview-new" aria-hidden="true"></span>
          <span class="shop-preview-hit shop-preview-sounds" aria-hidden="true"></span>
          <span class="shop-preview-hit shop-preview-merch" aria-hidden="true"></span>
          <span class="shop-preview-hit shop-preview-search" aria-hidden="true"></span>
          <span class="shop-preview-hit shop-preview-bag" aria-hidden="true"></span>
          <span class="shop-preview-hit shop-preview-all" aria-hidden="true"></span>
        </div>
        <div class="shop-footer">
          <button class="window-resize-handle shop-resize-handle" type="button" aria-label="Resize Shop window"></button>
        </div>
      </section>
    </div>
    <section class="player-layer" id="player-layer" aria-label="ZUMA Player" hidden>
      <iframe id="player-frame" title="ZUMA Player" allow="autoplay" loading="eager"></iframe>
    </section>

    <footer class="zuma-dock" aria-label="Zuma menu preview">
      <img class="dock-menu-bg" src="dock-menu.png" alt="">
      <button class="dock-start-panel" id="dock-start-trigger" type="button" aria-label="Open ZUMA window" aria-haspopup="dialog">
        <img class="dock-start-bg" src="dock-start.png" alt=""><img class="dock-rainwave" src="dock-rainwave.png" alt=""><img class="dock-zuma-text" src="dock-zuma-text.png" alt="">
      </button>
      <nav class="dock-tasks" aria-label="Open windows">
        <div class="dock-task-list" id="dock-task-list" tabindex="0" aria-label="Open windows, scroll horizontally for more"></div>
      </nav>
      <div class="dock-task-area">
        <img class="dock-task-bg" src="dock-taskbar.png" alt="">
        <div class="dock-icons" aria-label="Future Zuma sections">
          <span class="dock-item dock-sign"><img src="dock-sign.png" alt="Sign" draggable="false"></span><button class="dock-item dock-archives-trigger" id="dock-archives-trigger" type="button" aria-label="Open Archives window" aria-haspopup="dialog"><img src="dock-archives.png" alt=""></button><button class="dock-item dock-player-trigger" id="dock-player-trigger" type="button" aria-label="Open ZUMA Player" aria-haspopup="dialog" aria-pressed="false"><img src="dock-playlist.png" alt="" draggable="false"></button><button class="dock-item dock-shop-trigger" id="dock-shop-trigger" type="button" aria-label="Open Zuma Shop window" aria-haspopup="dialog"><img src="dock-shop.png" alt="" draggable="false"></button><span class="dock-item"><img src="dock-about.png" alt="About"></span>
        </div>
      </div>
    </footer>
  </main>
  <script src="dock-drop.js?v=20261012-edges"></script>
  <script src="portrait-dock.js?v=20261014-reset"></script>
  <script src="script.js?v=20261123-shop-balanced-chrome"></script>
  <script type="module" src="archives.js?v=20261011-compact"></script>
  <script src="mobile-task-swipe.js?v=20261014-overflow-swipe"></script>
  <script src="window-controls.js?v=20261124-shop-compact-grain"></script>
  <script src="player-window.js?v=20261123-playlist-no-select"></script>
</body>
</html>

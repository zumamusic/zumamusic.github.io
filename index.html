<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#8bb5b7">
  <title>Zuma Music — Coming Soon</title>
  <meta name="description" content="Zuma lands in 2027. Join the waitlist.">
  <meta property="og:title" content="Zuma Music — Coming Soon">
  <meta property="og:description" content="Zuma lands in 2027.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zuma.music">
  <meta property="og:image" content="https://zuma.music/og-v2.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="dolphin-favicon.png">
  <link rel="apple-touch-icon" href="dolphin-favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="desktop">
    <div class="wash" aria-hidden="true"></div>
    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="Zuma Music home"><img src="zuma-music-wordmark.png" alt="Zuma Music"></a>
      <nav class="nav" aria-label="Main navigation">
        <a href="https://tstack.app/zuma" target="_blank" rel="noopener noreferrer">demos</a>
        <a href="mailto:demos@zuma.music">contact</a>
      </nav>
    </header>

    <img class="homepage-rainwave" src="rainwave-homepage.png" alt="" aria-hidden="true">

    <section class="notice-wrap" id="home" aria-label="Coming soon announcement">
      <div class="notice-window" id="notice-window">
        <div class="titlebar" id="titlebar" role="button" tabindex="0" aria-label="Drag Zuma Notice window. Use arrow keys to move it and Escape to reset.">
          <span class="mini-wave" aria-hidden="true"></span><span>Zuma_Socials</span>
          <div class="mini-controls">
            <a href="https://www.tiktok.com/@zumamusc" target="_blank" rel="noopener noreferrer" aria-label="Open Zuma on TikTok"><img src="window-tiktok.png" alt=""></a>
            <a href="https://www.instagram.com/zumamusc" target="_blank" rel="noopener noreferrer" aria-label="Open Zuma on Instagram"><img src="window-instagram.png" alt=""></a>
            <a href="https://x.com/zumamusc" target="_blank" rel="noopener noreferrer" aria-label="Open Zuma on X"><img src="window-close.png" alt=""></a>
          </div>
        </div>
        <div class="notice-body">
          <div class="sunset-art" role="img" aria-label="Four dark sculptural forms beside the ocean at sunset"></div>
          <div class="message">
            <h1>coming soon.</h1>
            <p>Zuma lands in 2027.</p>
            <p class="invite">join the waitlist.</p>
            <form id="waitlist-form">
              <label class="sr-only" for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="email address" required autocomplete="email">
              <button type="submit">join</button>
            </form>
            <div class="success" id="form-message" role="status" hidden>waitlist signups open soon.</div>
          </div>
        </div>
        <div class="resize-grip" aria-hidden="true">///</div>
      </div>
    </section>

    <section class="desktop-folders" aria-label="Zuma collections">
      <a href="https://untitled.stream/library/project/MYrlEZppGPqCRY5uA4fcw" target="_blank" rel="noreferrer"><img class="folder" src="folder-icon.png" alt="">Music</a>
      <a href="https://www.youtube.com/@zumamusc" target="_blank" rel="noreferrer"><img class="folder" src="folder-icon.png" alt="">Archives</a>
    </section>

    <footer class="zuma-dock" aria-label="Zuma menu preview">
      <img class="dock-menu-bg" src="dock-menu.png" alt="">
      <div class="dock-start-panel" aria-hidden="true">
        <img class="dock-start-bg" src="dock-start.png" alt=""><img class="dock-rainwave" src="dock-rainwave.png" alt=""><img class="dock-zuma-text" src="dock-zuma-text.png" alt="">
      </div>
      <div class="dock-task-area">
        <img class="dock-task-bg" src="dock-taskbar.png" alt="">
        <div class="dock-icons" aria-label="Future Zuma sections">
          <span class="dock-item dock-sign"><img src="dock-sign.png" alt="Sign"></span><span class="dock-item"><img src="dock-archives.png" alt="Archives"></span><span class="dock-item"><img src="dock-playlist.png" alt="Playlist"></span><span class="dock-item"><img src="dock-shop.png" alt="Shop"></span><span class="dock-item"><img src="dock-about.png" alt="About"></span>
        </div>
      </div>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
